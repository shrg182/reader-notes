name: Deploy Reader Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify foundation
        run: |
          npm ci
          npm test
      - uses: actions/configure-pages@v5
      - name: Prepare public app
        run: |
          mkdir _site
          cp index.html styles.css app.js core.js rich-model.js rich-editor.js cloud.js storage.js config.js toolbar.js toolbar-model.js migration-model.js migration-ui.js migration-library.js migration-complete-ui.js library-taxonomy.js library-groups.js sharing-model.js sharing-ui.js _site/
          cp -R studio vendor _site/
          cp device-pdfs.js pdf-library-model.js pdf-cloud.js pdf-library.js pdf-viewer.js pdf-speech.js _site/
          cp service-worker.js manifest.webmanifest reader-icon.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
